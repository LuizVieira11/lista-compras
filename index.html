    <script>
      // Suppress Vite HMR WebSocket disconnect errors in AI Studio cloud preview proxy
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || err.reason || String(err));
          return str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (isViteWsError(e.message) || isViteWsError(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
